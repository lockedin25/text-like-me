[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "personal-chat-v4"
version = "0.1.0"
description = "A data-free recipe for personal conversational fine-tuning"
requires-python = ">=3.12"
dependencies = ["jsonschema>=4.23,<5"]

[project.optional-dependencies]
prepare = ["transformers==5.22.2", "tokenizers==0.23.3"]
train = ["transformers==5.22.2", "tokenizers==0.23.3", "torch==2.8.0", "peft==0.21.3", "accelerate>=1.0,<2"]
mac = ["mlx-lm==0.32.2"]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
chat-recipe = "recipe.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/recipe"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
